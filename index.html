<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DawnBloom — Volunteer & Student Guidance Management System</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, rgba(226, 194, 210, 0.15) 0%, rgba(75, 61, 79, 0.3) 50%, #0C0F17 80%);
      color: #F7F5F9;
      text-align: center;
      padding: 24px;
    }
    .splash-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(226, 194, 210, 0.2);
      border-top-color: #B26C86;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <svg width="68" height="68" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="splashSunGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#E2C2D2"/>
          <stop offset="50%" stop-color="#B26C86"/>
          <stop offset="100%" stop-color="#4B3D4F"/>
        </linearGradient>
        <linearGradient id="splashGlow" x1="20" y1="10" x2="20" y2="34" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#E2C2D2" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#B26C86" stop-opacity="0.1"/>
        </linearGradient>
      </defs>
      <circle cx="20" cy="20" r="18" fill="url(#splashSunGrad)" fill-opacity="0.15" stroke="rgba(226, 194, 210, 0.3)" stroke-width="1.2"/>
      <path d="M10 26 C12 18, 28 18, 30 26" stroke="#E2C2D2" stroke-width="2" stroke-linecap="round" fill="url(#splashGlow)"/>
      <path d="M20 12 L20 8 M13 15 L10 12 M27 15 L30 12" stroke="#E2C2D2" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M8 28 C14 24, 26 24, 32 28 C26 31, 14 31, 8 28 Z" fill="#B26C86" fill-opacity="0.6" stroke="#E2C2D2" stroke-width="1"/>
      <path d="M20 4 L21 7 L24 8 L21 9 L20 12 L19 9 L16 8 L19 7 Z" fill="#E2C2D2"/>
    </svg>
    <h1 style="font-size: 1.8rem; margin-top: 16px; font-weight: 700; letter-spacing: -0.01em;">DawnBloom</h1>
    <p style="color: #868092; font-size: 0.95rem; margin-top: 4px;">Volunteer & Student Guidance Management System</p>
    <p style="color: #E2C2D2; font-size: 0.85rem; font-style: italic; margin-top: 6px;">“A new beginning. A brighter tomorrow.”</p>
    <div class="splash-spinner"></div>
    <a href="login.html" id="manualRedirectLink" style="margin-top: 18px; font-size: 0.82rem; color: #E2C2D2; text-decoration: underline; opacity: 0.85;">Entering portal... (click here if not redirected automatically)</a>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function() {
      try {
        const user = window.DawnBloomAuth ? window.DawnBloomAuth.getCurrentUser() : null;
        setTimeout(() => {
          if (user && user.role && user.role.toLowerCase() === 'student') {
            window.location.replace('student-dashboard.html');
          } else if (user) {
            window.location.replace('dashboard.html');
          } else {
            window.location.replace('login.html');
          }
        }, 300);
      } catch (e) {
        window.location.replace('login.html');
      }
    })();
  </script>
</body>
</html>
